name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t flaskapp .

      - name: Save Docker image
        run: docker save flaskapp -o flaskapp.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: flask-image
          path: flaskapp.tar

  docker-push:
    runs-on: ubuntu-latest
    needs: [unit-tests, docker-build]
    if: success() && github.event_name == 'push'

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: flask-image

      - name: Load Docker image
        run: docker load -i flaskapp.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag flaskapp yahiamahouachi/flaskapp:latest
          docker push yahiamahouachi/flaskapp:latest
      - name: Login to private registry
        if: false
        uses: docker/login-action@v3
        with:
          registry: registry.example.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push to private registry
        if: false
        run: |
          docker tag flaskapp registry.example.com/flaskapp:latest
          docker push registry.example.com/flaskapp:latest
